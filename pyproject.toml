[project]
name = "mojito"
version = "0.1.0"
description = "Molecular Juxtaposition Tokenizer"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "rdkit", "numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
wandb = ["wandb"]

[tool.setuptools]
packages = ["mojito"]
